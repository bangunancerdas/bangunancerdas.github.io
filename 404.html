<!doctype html>
<html lang="id" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman Tidak Ditemukan | Bangunan Cerdas</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Halaman yang Anda cari tidak ditemukan." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo/logo-light.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo/logo-dark.svg" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      var theme = 'light';
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      if (stored === 'light' || stored === 'dark') {
        theme = stored;
      } else {
        try { if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'; } catch (e) {}
      }
      document.documentElement.classList.add('theme-' + theme);
      document.documentElement.classList.remove('no-js');
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/" aria-label="Kembali ke Beranda">
        <img class="logo logo-light" src="/assets/logo/logo-light.svg" alt="Logo Bangunan Cerdas" width="40" height="40" loading="eager" />
        <img class="logo logo-dark" src="/assets/logo/logo-dark.svg" alt="Logo Bangunan Cerdas" width="40" height="40" loading="eager" />
        <span>Bangunan Cerdas</span>
      </a>
      <button id="theme-toggle" class="btn btn-outline" type="button" aria-label="Ubah mode warna"></button>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="notfound">
        <p class="kicker">Error 404</p>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>Maaf, halaman yang Anda cari tidak tersedia atau sudah dipindahkan.</p>
        <div class="cta-row">
          <a class="btn btn-primary" href="/">Kembali ke Beranda</a>

        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <p class="footer-brand">Bangunan Cerdas</p>
        <p class="muted">Smart building untuk masa depan yang lebih efisien.</p>
      </div>
      <nav aria-label="Navigasi footer">
        <ul>
          <li><a href="/">Beranda</a></li>

  <script src="/analytics.js" defer></script>
</body>
